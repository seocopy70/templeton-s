# Templeton S - scheduled FRED macro data collection
name: Macro data collection

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/macro_data.yml"
      - "scripts/collect_macro.py"
      - "src/macro/**"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect FRED macro data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/collect_macro.py

      - name: Commit macro data if changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "templeton-s-bot"
          git config user.email "templeton-s-bot@users.noreply.github.com"
          git add data/macro/raw data/macro/processed/macro_daily.csv
          if git diff --staged --quiet; then
            echo "No macro data changes to commit"
          else
            git commit -m "chore(data): collect FRED macro data $(date -u +%Y-%m-%d)"
            git push
          fi
